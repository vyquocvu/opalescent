name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -- run examples/hello.opal
      - run: cargo run -- check examples/flow.opal
      - run: cargo run -- run examples/modes.opal
      - run: cargo run -- run examples/enums.opal
